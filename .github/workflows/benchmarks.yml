name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  benchmarks:
    name: Go performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Run benchmarks
        run: |
          go test -run '^$' -bench '^(BenchmarkRegistry|BenchmarkRunner)' -benchmem -benchtime=300ms -count=3 ./internal/tools ./internal/execution | tee benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: universal-mcp-benchmarks
          path: benchmark-results.txt
          if-no-files-found: error
          retention-days: 30
